name: obs-live-bot

services:
  api:
    build:
      context: .
      dockerfile: src/dotnet/ObsLiveBot.Api/Dockerfile
    container_name: obs-live-bot-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OBS_LIVE_BOT_API_PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      OBS_WEBSOCKET_HOST: ${OBS_WEBSOCKET_HOST:-host.docker.internal}
      OBS_WEBSOCKET_PORT: ${OBS_WEBSOCKET_PORT:-4455}
      OBS_WEBSOCKET_PASSWORD: ${OBS_WEBSOCKET_PASSWORD:-}
      LiveChat__BufferCapacity: ${LIVE_CHAT_BUFFER_CAPACITY:-500}
      LiveChat__DeduplicationCapacity: ${LIVE_CHAT_DEDUPLICATION_CAPACITY:-2000}
      GFM_STUDIOOS_CONFIG_PATH: /app/config
      CredentialHelper__BaseUrl: http://host.docker.internal:51823/
      CredentialHelper__SharedKey: ${GFM_STUDIOOS_CREDENTIAL_HELPER_SHARED_KEY:-}
      TIKTOK_ENABLED: ${TIKTOK_ENABLED:-false}
      TIKTOK_CHANNEL: ${TIKTOK_CHANNEL:-}
      Interactions__Ollama__BaseUrl: http://host.docker.internal:11434
      Narration__HostRuntimeDirectory: ${OBS_LIVE_BOT_TTS_HOST_DIRECTORY:-D:/OBS-Live/OBS-Live-Bot/data/runtime/tts}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${GFM_STUDIOOS_CONFIG_PATH:?Set GFM_STUDIOOS_CONFIG_PATH in the local .env file}:/app/config:ro
      - ./data/runtime/tts-engine:/opt/tts-engine:ro
      - ./data/runtime/tts:/app/data/runtime/tts
    networks:
      - obs-live-bot
      - socialstream-internal

  socialstream:
    build:
      context: .
      dockerfile: infra/socialstream/Dockerfile
      args:
        SSN_VERSION: "0.4.18"
        SSN_SHA256: "1ed1406de5a75faae6bb3fc4572ac76bde44f78585c01f77c2eb888d98ff8c14"
    image: gfm-studioos/socialstream-ninja:0.4.18
    container_name: gfm-studioos-socialstream
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DISPLAY: :99
      HOME: /var/lib/socialstream
      XDG_CACHE_HOME: /tmp/cache
      SSAPP_USER_DATA_DIR: /var/lib/socialstream
      SSAPP_CONTROL_API: "1"
      SSAPP_CONTROL_PORT: "17777"
    volumes:
      - ./data/runtime/socialstream:/var/lib/socialstream
    tmpfs:
      - /tmp:rw,nosuid,size=256m,mode=1777,uid=10001,gid=10001
      - /tmp/.X11-unix:rw,nosuid,size=16m,mode=1777
    networks:
      - socialstream-internal
      - socialstream-egress

  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:latest}
    container_name: obs-live-bot-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5679}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5679}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5679/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in the local .env file}
      N8N_HMAC_SIGNATURE_SECRET: ${N8N_HMAC_SIGNATURE_SECRET:?Set N8N_HMAC_SIGNATURE_SECRET in the local .env file}
      N8N_BINARY_DATA_SIGNING_SECRET: ${N8N_BINARY_DATA_SIGNING_SECRET:?Set N8N_BINARY_DATA_SIGNING_SECRET in the local .env file}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET:?Set N8N_USER_MANAGEMENT_JWT_SECRET in the local .env file}
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      OBS_CONFIG_ROOT: ${OBS_CONFIG_ROOT}
      OBS_HOST: ${OBS_WEBSOCKET_HOST:-host.docker.internal}
      OBS_WEBSOCKET_PORT: ${OBS_WEBSOCKET_PORT:-4455}
      OBS_WEBSOCKET_PASSWORD: ${OBS_WEBSOCKET_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./n8n/workflows:/files/workflows
      - ./n8n/backup:/files/backup
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - obs-live-bot

networks:
  obs-live-bot:
    name: obs-live-bot
  socialstream-internal:
    name: gfm-studioos-socialstream
    internal: true
  socialstream-egress:
    name: gfm-studioos-socialstream-egress
